title: Greenborough Writing
description: 

collections:
  characters:
    output: true
    permalink: /characters/:name/
  stories:
    output: true
    permalink: /stories/:path/

defaults:
  - scope:
      path: ""
      type: "characters"
    values:
      layout: character
  - scope:
      path: ""
      type: "stories"
    values:
      layout: story
